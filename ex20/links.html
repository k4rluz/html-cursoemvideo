<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: darkorange;
            text-decoration: none;
            font-weight: bold;
        }
        
        a:visited{
            color:black ;
        }
        
        a:hover{
            color: darkslategray;
            text-decoration: underline;
        }
        a:active{
            color: yellowgreen;
        }

       a::before{
        content: '♠';
       }
        a::after{
            content:  '♠';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://google.com" target="_blank">Repositorio Github</a></li>
        <li><a href="https://youtube.com" target="_blank">Canal do Youtube</a></li>
        <li><a href="https://cursoemvideo.com" target="_blank">Site Curso em video</a></li>
    </ul>
</body>
</html>
